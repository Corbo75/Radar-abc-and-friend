<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radar de Survie - Hybrid Sonar & Cue Tone</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0d1117 !important;
      color: #00ff66 !important;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .radar-container {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 2px solid #00ff66;
      background: radial-gradient(circle, rgba(0,255,102,0.1) 0%, rgba(0,0,0,0.9) 100%);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .grid-line {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1px dashed rgba(0, 255, 102, 0.4);
      border-radius: 50%;
      pointer-events: none;
    }
    .r-100 { width: 33%; height: 33%; border-color: rgba(255, 204, 0, 0.8); }
    .r-250 { width: 66%; height: 66%; }
    .r-500 { width: 100%; height: 100%; }

    .sweep {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 0; right: 0;
      transform-origin: 0% 100%;
      background: conic-gradient(from 180deg at 0% 100%, rgba(0, 255, 102, 0.5) 0deg, transparent 60deg);
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .info-panel {
      width: 280px;
      background: #161b22;
      border: 1px solid #00ff66;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .target-info {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .mode-info {
      font-size: 0.8em;
      color: #8b949e;
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background: #0d1117;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 8px 12px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
    }

    button:active {
      background: #00ff66;
      color: #000;
    }
  </style>
</head>
<body style="background-color: #0d1117; color: #00ff66;">

  <div class="radar-container">
    <div class="grid-line r-100"></div>
    <div class="grid-line r-250"></div>
    <div class="grid-line r-500"></div>
    <div class="sweep"></div>
  </div>

  <div class="info-panel">
    <div id="target-display" class="target-info">Analyse en cours...</div>
    <div id="mode-display" class="mode-info">Mode: --</div>
    <div class="controls">
      <button onclick="toggleAudio()">🔊 Audio: <span id="sound-status">OFF</span></button>
      <button onclick="cycleTarget()">🎯 Changer Cible</button>
    </div>
  </div>

  <script>
    let ac = null;
    let soundOn = false;
    let lastPingTime = 0;

    const FQ = {
      'Point A': 1200,
      'Point B': 900,
      'Point C': 600,
      'Coéquipier': 1500
    };

    function initAudio() {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleAudio() {
      initAudio();
      soundOn = !soundOn;
      document.getElementById('sound-status').innerText = soundOn ? "ON" : "OFF";
      if (soundOn && ac.state === 'suspended') {
        ac.resume();
      }
    }

    function ping(vol, freq, duration = 0.1) {
      if (!ac || !soundOn) return;
      try {
        const t = ac.currentTime;
        const o = ac.createOscillator();
        const v = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, t);
        v.gain.setValueAtTime(0.0001, t);
        v.gain.linearRampToValueAtTime(vol, t + 0.01);
        v.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        o.connect(v);
        v.connect(ac.destination);
        o.start(t);
        o.stop(t + duration);
      } catch(e) {}
    }

    function playCueTone(angleDegrees, distance) {
      if (!ac || !soundOn) return;
      try {
        const t = ac.currentTime;
        const o = ac.createOscillator();
        const v = ac.createGain();
        o.type = 'sine';

        const normalizedY = Math.cos(angleDegrees * Math.PI / 180);
        const baseFreq = 600 + (normalizedY * 250);

        const normalizedX = Math.sin(angleDegrees * Math.PI / 180);
        const deltaFreq = normalizedX * 300;

        const startFreq = baseFreq - deltaFreq;
        const endFreq = baseFreq + deltaFreq;

        const duration = 0.15;
        o.frequency.setValueAtTime(startFreq, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(100, endFreq), t + duration);

        const vol = Math.min(0.4, 0.1 + (1 - distance / 100) * 0.3);
        v.gain.setValueAtTime(0.0001, t);
        v.gain.linearRampToValueAtTime(vol, t + 0.01);
        v.gain.exponentialRampToValueAtTime(0.0001, t + duration);

        o.connect(v);
        v.connect(ac.destination);
        o.start(t);
        o.stop(t + duration);
      } catch(e) {}
    }

    function processRadarSound(target) {
      if (!soundOn || !ac) return;
      const now = performance.now();

      if (target.dist >= 100) {
        if (now - lastPingTime < 3000) return;
        lastPingTime = now;

        ping(0.3, 1800, 0.05);

        const echoDelayMs = (target.dist / 250) * 1000;
        const echoVolume = Math.max(0.05, 0.35 * (1 - target.dist / 1000));
        const echoFreq = FQ[target.key] || 1000;

        setTimeout(() => {
          ping(echoVolume, echoFreq, 0.12);
        }, echoDelayMs);

      } else {
        const interval = Math.max(250, target.dist * 12);
        if (now - lastPingTime < interval) return;
        lastPingTime = now;

        playCueTone(target.angle, target.dist);
      }
    }

    const targets = [
      { name: 'Point A (Éloigné)', dist: 250, angle: 0, color: '#00ff66', key: 'Point A' },
      { name: 'Point B (Très Loin)', dist: 500, angle: 45, color: '#ffcc00', key: 'Point B' },
      { name: 'Cible Proche Gauche', dist: 45, angle: -60, color: '#ff3333', key: 'Point C' },
      { name: 'Coéquipier Proche Droite', dist: 30, angle: 60, color: '#00ccff', key: 'Coéquipier' },
      { name: 'Danger Derrière', dist: 15, angle: 180, color: '#ff0055', key: 'Point A' }
    ];

    let currentTargetIndex = 0;

    function cycleTarget() {
      currentTargetIndex = (currentTargetIndex + 1) % targets.length;
      updateRadar();
    }

    function updateRadar() {
      const activeTarget = targets[currentTargetIndex];
      const display = document.getElementById('target-display');
      const modeDisplay = document.getElementById('mode-display');

      display.innerText = `${activeTarget.name} : ${activeTarget.dist} m`;
      display.style.color = activeTarget.color;

      if (activeTarget.dist >= 100) {
        modeDisplay.innerText = "Mode: Sonar Écho (Émis. -> Écho 1s/250m)";
      } else {
        const side = activeTarget.angle < 0 ? "Gauche (Tone Ascendant)" : (activeTarget.angle > 0 ? "Droite (Tone Descendant)" : "Axe");
        modeDisplay.innerText = `Mode: Cue Tone Proximité [${side}]`;
      }

      processRadarSound(activeTarget);
    }

    setInterval(() => {
      updateRadar();
    }, 200);
  </script>
</body>
</html>
