<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Survie Tactical</title>
    <style>
        :root {
            --bg-color: #080c08;
            --radar-green: #00ff66;
            --radar-dim: #003311;
            --panel-bg: #0f170f;
            --text-color: #a0ffa0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.2rem;
            margin: 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--radar-green);
            text-shadow: 0 0 5px var(--radar-green);
        }

        .radar-screen {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background-color: #000500;
            border: 2px solid var(--radar-green);
            box-shadow: 0 0 15px var(--radar-dim);
            margin: 10px 0;
            overflow: hidden;
        }

        .grid-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px dashed var(--radar-dim);
            border-radius: 50%;
            pointer-events: none;
        }

        .c-100 { width: 33.3%; height: 33.3%; border-color: rgba(255, 204, 0, 0.5); }
        .c-250 { width: 66.6%; height: 66.6%; }
        .c-500 { width: 100%; height: 100%; }

        .axis-v, .axis-h {
            position: absolute;
            background-color: var(--radar-dim);
            pointer-events: none;
        }
        .axis-v { top: 0; bottom: 0; left: 50%; width: 1px; }
        .axis-h { left: 0; right: 0; top: 50%; height: 1px; }

        .sweep-line {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 50%;
            transform-origin: 0% 100%;
            background: linear-gradient(135deg, rgba(0, 255, 102, 0.4) 0%, transparent 70%);
            animation: radarSweep 3s linear infinite;
        }

        @keyframes radarSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .controls-container {
            width: 100%;
            max-width: 320px;
            background-color: var(--panel-bg);
            border: 1px solid var(--radar-dim);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .target-card {
            background: #050a05;
            border: 1px solid #1a331a;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .target-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--radar-green);
        }

        .target-details {
            font-size: 0.85rem;
            color: #7a9a7a;
            margin-top: 4px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            background: #102010;
            border: 1px solid var(--radar-green);
            color: var(--radar-green);
            padding: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active {
            background: var(--radar-green);
            color: #000;
        }
    </style>
</head>
<body>

    <h1>RADAR TACTIQUE</h1>

    <div class="radar-screen">
        <div class="grid-circle c-100"></div>
        <div class="grid-circle c-250"></div>
        <div class="grid-circle c-500"></div>
        <div class="axis-v"></div>
        <div class="axis-h"></div>
        <div class="sweep-line"></div>
    </div>

    <div class="controls-container">
        <div class="target-card">
            <div id="target-name" class="target-name">SÉLECTION CIBLE</div>
            <div id="target-details" class="target-details">Distance: -- | Mode: --</div>
        </div>

        <div class="btn-row">
            <button onclick="toggleAudio()">🔊 AUDIO: <span id="sound-status">OFF</span></button>
            <button onclick="nextTarget()">🎯 CHANGER CIBLE</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let ac = null;
        let soundOn = false;
        let lastPingTime = 0;

        const FREQ_MAP = {
            'Point A': 1200,
            'Point B': 900,
            'Point C': 600,
            'Coéquipier': 1500
        };

        function initAudio() {
            if (!ac) {
                ac = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudio();
            soundOn = !soundOn;
            document.getElementById('sound-status').innerText = soundOn ? "ON" : "OFF";
            if (soundOn && ac.state === 'suspended') {
                ac.resume();
            }
        }

        function ping(vol, freq, duration = 0.1) {
            if (!ac || !soundOn) return;
            try {
                const t = ac.currentTime;
                const o = ac.createOscillator();
                const v = ac.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, t);
                v.gain.setValueAtTime(0.0001, t);
                v.gain.linearRampToValueAtTime(vol, t + 0.01);
                v.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                o.connect(v);
                v.connect(ac.destination);
                o.start(t);
                o.stop(t + duration);
            } catch(e) {}
        }

        // Cue tone pour proximité < 100m (ascendant à gauche, descendant à droite)
        function playCueTone(angleDegrees, distance) {
            if (!ac || !soundOn) return;
            try {
                const t = ac.currentTime;
                const o = ac.createOscillator();
                const v = ac.createGain();
                o.type = 'sine';

                // Devant = Aigu, Derrière = Grave
                const normalizedY = Math.cos(angleDegrees * Math.PI / 180);
                const baseFreq = 600 + (normalizedY * 250);

                // Gauche = Ascendant, Droite = Descendant
                const normalizedX = Math.sin(angleDegrees * Math.PI / 180);
                const deltaFreq = normalizedX * 300;

                const startFreq = baseFreq - deltaFreq;
                const endFreq = baseFreq + deltaFreq;

                const duration = 0.15;
                o.frequency.setValueAtTime(startFreq, t);
                o.frequency.exponentialRampToValueAtTime(Math.max(100, endFreq), t + duration);

                const vol = Math.min(0.4, 0.1 + (1 - distance / 100) * 0.3);
                v.gain.setValueAtTime(0.0001, t);
                v.gain.linearRampToValueAtTime(vol, t + 0.01);
                v.gain.exponentialRampToValueAtTime(0.0001, t + duration);

                o.connect(v);
                v.connect(ac.destination);
                o.start(t);
                o.stop(t + duration);
            } catch(e) {}
        }

        function processRadarAudio(target) {
            if (!soundOn || !ac) return;
            const now = performance.now();

            if (target.dist >= 100) {
                // === MODE SONAR ÉCHO (> 100m) ===
                if (now - lastPingTime < 3000) return;
                lastPingTime = now;

                // 1. BIP ÉMISSION DE TOI
                ping(0.3, 1800, 0.05);

                // 2. ÉCHO DE RETOUR (Calibré : 1 sec = 250 mètres)
                const echoDelayMs = (target.dist / 250) * 1000;
                const echoVolume = Math.max(0.05, 0.35 * (1 - target.dist / 1000));
                const echoFreq = FREQ_MAP[target.key] || 1000;

                setTimeout(() => {
                    ping(echoVolume, echoFreq, 0.12);
                }, echoDelayMs);

            } else {
                // === MODE CUE TONE (< 100m) ===
                const interval = Math.max(250, target.dist * 12);
                if (now - lastPingTime < interval) return;
                lastPingTime = now;

                playCueTone(target.angle, target.dist);
            }
        }

        // --- CIBLES SIMULÉES ---
        const targets = [
            { name: 'Point A', dist: 250, angle: 0, key: 'Point A' },
            { name: 'Point B', dist: 500, angle: 45, key: 'Point B' },
            { name: 'Point C (Proche Gauche)', dist: 45, angle: -60, key: 'Point C' },
            { name: 'Coéquipier (Proche Droite)', dist: 30, angle: 60, key: 'Coéquipier' },
            { name: 'Danger Derrière', dist: 15, angle: 180, key: 'Point A' }
        ];

        let targetIndex = 0;

        function nextTarget() {
            targetIndex = (targetIndex + 1) % targets.length;
            updateDisplay();
        }

        function updateDisplay() {
            const current = targets[targetIndex];
            document.getElementById('target-name').innerText = current.name;

            const modeStr = current.dist >= 100 ? "Sonar Écho (1s/250m)" : "Cue Tone Proximité";
            document.getElementById('target-details').innerText = `Distance: ${current.dist}m | Mode: ${modeStr}`;

            processRadarAudio(current);
        }

        window.onload = function() {
            updateDisplay();
            setInterval(updateDisplay, 200);
        };
    </script>
</body>
</html>
